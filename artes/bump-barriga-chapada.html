<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Order bump – Protocolo Barriga Chapada</title>
<!-- Imagem do order bump. Dois formatos no mesmo arquivo:
     16:9 1600x900 (abrir normal) e quadrado 1080x1080 (abrir com #1x1 no fim do endereço).
     Para gerar o PNG, abra no navegador no tamanho do formato e capture a tela. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  /* mesmas cores e fontes do banner do checkout */
  :root{
    --blush:#FFF1F6; --pink:#DD578D; --pink-dark:#B83A6E; --ink:#1A1020; --muted:#5B5160;
    --font-title:"Sora", "Segoe UI", Arial, sans-serif;
    --font-text:"Montserrat", "Segoe UI", Arial, sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{overflow:hidden;background:var(--blush)}
  body{display:grid;grid-template-columns:680px 1fr;width:1600px;height:900px;overflow:hidden;background:var(--blush);color:var(--ink);font-family:var(--font-text);-webkit-font-smoothing:antialiased}

  .photo{position:relative;margin:40px 0 40px 40px;border-radius:36px;overflow:hidden}
  .photo img{display:block;width:100%;height:100%;object-fit:cover;object-position:82% 50%}
  .photo .tag{position:absolute;left:28px;bottom:28px;padding:12px 20px;border-radius:999px;background:#fff;color:var(--pink-dark);font:700 20px var(--font-title);letter-spacing:.08em}

  .copy{display:flex;flex-direction:column;justify-content:center;gap:30px;padding:64px 80px}
  .eyebrow{font:700 22px var(--font-title);letter-spacing:.16em;text-transform:uppercase;color:var(--pink)}
  h1{max-width:760px;font:800 72px/1.04 var(--font-title);letter-spacing:-.015em;text-wrap:balance}
  h1 em{display:block;font-style:normal;color:var(--pink)}
  .sub{max-width:720px;font:500 28px/1.4 var(--font-text);color:var(--muted);text-wrap:balance}
  .chips{display:flex;flex-wrap:wrap;gap:12px}
  .chips span{display:inline-flex;align-items:center;gap:10px;padding:11px 18px;border:2px solid rgba(221,87,141,.35);border-radius:999px;background:#fff;font:700 21px var(--font-text);color:var(--ink)}
  .chips svg{width:20px;height:20px;color:var(--pink)}

  /* quadrado 1080x1080: foto em cima, texto embaixo */
  body.q{grid-template-columns:1fr;grid-template-rows:600px 1fr;width:1080px;height:1080px}
  .q .photo{margin:40px 40px 0}
  .q .photo img{object-position:50% 74%}
  .q .copy{gap:20px;padding:28px 48px 40px}
  .q .eyebrow{font-size:20px}
  .q h1{max-width:none;font-size:54px}
  .q .sub{max-width:none;font-size:24px}
  .q .chips span{padding:10px 16px;font-size:20px}
</style>
</head>
<body>
  <script>if (location.hash === '#1x1') document.body.classList.add('q');</script>
  <div class="photo">
    <img src="../quiz-pilates-28-dias/img/beneficio-barriga.jpg" alt="">
    <span class="tag">FOCO NO ABDÔMEN</span>
  </div>

  <div class="copy">
    <p class="eyebrow">Protocolo Barriga Chapada</p>
    <h1>A barriga é a última a sair? <em>Não precisa ser.</em></h1>
    <p class="sub">Exercícios focados só no abdômen, somados ao seu plano.</p>
    <div class="chips">
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>Poucos minutos</span>
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>Sem impacto</span>
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>Sem forçar as costas</span>
    </div>
  </div>
</body>
</html>
